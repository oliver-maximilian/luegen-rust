server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ----------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # --- Hashed build assets: cache hard ------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- App shell: never cache --------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- SPA fallback ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No /api/ block on purpose: the host reverse proxy (nginx-proxy-manager)
    # forwards /api and the /api/game WebSocket straight to the backend container.
}
