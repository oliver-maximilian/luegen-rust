[package]
name = "luegen-rust"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.47.1", features = ["full"] }
rand = "0.8"
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
serde_json = "1.0"
dashmap = "6.2.1"
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
mime_guess = "2"
[[bin]]
name = "luegen-rust"
path = "main.rs"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false